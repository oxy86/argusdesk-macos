<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- macOS squircle background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4652"/>
      <stop offset="100%" stop-color="#1B2229"/>
    </linearGradient>

    <!-- Subtle top sheen for glass feel -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Server chassis gradient -->
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C8B99"/>
      <stop offset="100%" stop-color="#4C5A67"/>
    </linearGradient>

    <linearGradient id="chassisDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#68767F"/>
      <stop offset="100%" stop-color="#3A464E"/>
    </linearGradient>

    <!-- Screen gradient -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1116"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>

    <!-- Pulse line gradient -->
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="squircleClip">
      <rect x="8" y="8" width="240" height="240" rx="54" ry="54"/>
    </clipPath>
  </defs>

  <!-- Background squircle -->
  <rect x="8" y="8" width="240" height="240" rx="54" ry="54" fill="url(#bg)"/>
  <g clip-path="url(#squircleClip)">
    <rect x="8" y="8" width="240" height="130" fill="url(#sheen)"/>
  </g>

  <!-- Server rack stack, centered -->
  <g filter="url(#softShadow)">
    <!-- Bottom unit -->
    <rect x="60" y="164" width="136" height="34" rx="8" fill="url(#chassisDark)"/>
    <circle cx="76" cy="181" r="4.5" fill="#34D399"/>
    <rect x="92" y="177" width="60" height="4" rx="2" fill="#2A343C"/>
    <rect x="92" y="185" width="44" height="4" rx="2" fill="#2A343C"/>

    <!-- Middle unit -->
    <rect x="60" y="126" width="136" height="34" rx="8" fill="url(#chassis)"/>
    <circle cx="76" cy="143" r="4.5" fill="#34D399"/>
    <rect x="92" y="139" width="60" height="4" rx="2" fill="#39444D"/>
    <rect x="92" y="147" width="44" height="4" rx="2" fill="#39444D"/>

    <!-- Top unit / monitor display -->
    <rect x="60" y="58" width="136" height="64" rx="10" fill="url(#chassis)"/>
    <rect x="70" y="68" width="116" height="44" rx="6" fill="url(#screen)"/>

    <!-- Pulse / activity line on screen -->
    <polyline points="76,90 96,90 104,74 114,104 122,90 138,90 146,80 154,90 180,90"
              fill="none" stroke="url(#pulse)" stroke-width="3.4"
              stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Status dot -->
    <circle cx="76" cy="106" r="3.5" fill="#34D399"/>
  </g>

  <!-- Top rim highlight for glass effect -->
  <rect x="8" y="8" width="240" height="240" rx="54" ry="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>
</svg>
