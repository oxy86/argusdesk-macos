<svg width="44" height="44" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
  <!-- Menu bar template icon: flat black, will be tinted/inverted by macOS automatically -->
  <mask id="pulseMask">
    <rect x="0" y="0" width="44" height="44" fill="white"/>
    <polyline points="12,14 16,14 18,9.5 20.5,17.5 23,14 26,14 27.5,11 29,14 32,14"
              fill="none" stroke="black" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
  </mask>

  <g fill="#000000" mask="url(#pulseMask)">
    <rect x="7" y="7" width="30" height="14" rx="2.2"/>
  </g>

  <!-- Middle bar -->
  <rect x="7" y="24" width="30" height="6.5" rx="2" fill="#000000"/>
  <circle cx="11.2" cy="27.25" r="1.3" fill="#FFFFFF"/>

  <!-- Bottom bar -->
  <rect x="7" y="33.5" width="30" height="6.5" rx="2" fill="#000000"/>
  <circle cx="11.2" cy="36.75" r="1.3" fill="#FFFFFF"/>
</svg>
